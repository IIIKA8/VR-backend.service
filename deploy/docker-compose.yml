# Продакшен на VPS: только образ из GHCR (репозиторий IIIKA8/VR-backend.service).
# CI публикует: ghcr.io/iiika8/vr-backend.service:latest
#
# На сервере в этой же папке положите .env (скопируйте из .env.example).
# Обновление после push в main:
#   docker compose pull && docker compose up -d
# или просто:
#   docker compose up -d
#   (pull_policy: always подтянет новый latest автоматически)

services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/iiika8/vr-backend.service:latest}
    pull_policy: always
    container_name: vr-backend-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      SERVER_IP: 0.0.0.0
      MONGO_HOST: mongodb
      MONGO_DB: vr-app
      MONGO_USER: ${MONGO_USER:?Задайте MONGO_USER в .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Задайте MONGO_PASSWORD в .env}
      SESS_SECRET: ${SESS_SECRET:?Задайте SESS_SECRET в .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:4.4
    pull_policy: missing
    container_name: vr-backend-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vr-app
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongo -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 })" --quiet || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
