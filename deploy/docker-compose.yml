# Развёртывание только из образов Docker (без исходного кода на сервере).
# Образ должен быть собран и запушен в реестр (Docker Hub / GHCR).
# CI в репозитории публикует в GHCR при push в main — см. .github/workflows/docker-publish.yml
# Пример .env:
#   DOCKER_IMAGE=ghcr.io/iiiKA8/vr-backend.service:latest
#   SESS_SECRET=...
# Обновление после нового релиза:
#   docker compose pull && docker compose up -d

services:
  app:
    image: ${DOCKER_IMAGE:-leshien/vr-backend-web-app:latest}
    container_name: vr-backend-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      SERVER_IP: 0.0.0.0
      MONGODB_URI: mongodb://mongodb:27017/vr-app
      SESS_SECRET: ${SESS_SECRET:?Задайте SESS_SECRET в .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:4.4
    container_name: vr-backend-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vr-app
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
